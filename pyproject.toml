# ---------------------------------------------------------------------------
# Workspace root.
#
# This project is a *virtual* root: it is never built or deployed itself. It ties
# the Function Apps in `apps/` and the shared libraries in `packages/` together
# into one uv workspace with a single lock file and a single `.venv`, so that
# VSCode (Pylance), pytest, ruff and mypy see every package at once.
# ---------------------------------------------------------------------------
[project]
    name = "azure-functions-workspace"
    version = "0.1.0"
    description = "Template repo with multiple Azure Function Apps (Python v2 programming model) in one uv workspace"
    authors = [
        {name = "J. van Nijnatten"},
    ]
    readme = "README.md"
    license = "MIT"
    requires-python = ">=3.14"
    classifiers = [
        "Private :: Do Not Upload",
    ]
    # Depending on every workspace member means a plain `uv sync` installs all of them
    # (editable) into the root `.venv`.
    dependencies = [
        "api-app",
        "common",
        "worker-app",
    ]

[dependency-groups]
    dev = [
        "debugpy>=1.8.22",
        "pre-commit>=4.7.0",
        {include-group = "lint"},
        {include-group = "test"},
    ]
    lint = [
        "pyright[nodejs]>=1.1.414",
        "ruff>=0.17.6",
    ]
    test = [
        "pytest>=9.2.0",
        "pytest-cov>=7.1.0",
        "pytest-mock>=3.17.0",
    ]

[tool.uv]
    package = false
    required-version = ">=0.12.5"

[tool.uv.workspace]
    members = [
        "apps/*",
        "packages/*",
    ]

[tool.uv.sources]
    api-app = {workspace = true}
    common = {workspace = true}
    worker-app = {workspace = true}


# ---------------------------------------------------------------------------
# Ruff (linting + formatting). Members inherit this config.
# ---------------------------------------------------------------------------
[tool.ruff]
    line-length = 120
    target-version = "py314"
    extend-exclude = [
        "**/.python_packages",
    ]

[tool.ruff.lint]
    select = [
        "A",    # flake8-builtins
        "ANN",  # flake8-annotations
        "B",    # flake8-bugbear
        "BLE",  # flake8-blind-except
        "C4",   # flake8-comprehensions
        "C90",  # mccabe complexity
        "E",    # pycodestyle errors
        "F",    # pyflakes
        "FA",   # flake8-future-annotations
        "G",    # flake8-logging-format
        "I",    # isort
        "LOG",  # flake8-logging
        "PERF", # perflint
        "PT",   # flake8-pytest-style
        "PTH",  # flake8-use-pathlib
        "RUF",  # ruff-specific rules
        "S",    # flake8-bandit (security)
        "SIM",  # flake8-simplify
        "T10",  # flake8-debugger
        "T20",  # flake8-print
        "UP",   # pyupgrade
        "W",    # pycodestyle warnings
    ]
    ignore = [
        "COM812", # conflicts with the formatter
        "E501",   # line length is handled by the formatter
    ]

[tool.ruff.lint.per-file-ignores]
    "**/tests/**/*.py" = [
        "S101", # assert is how pytest works
    ]
    "scripts/**/*.py" = [
        "S603", # subprocess calls with trusted, fixed arguments
        "T201", # scripts may print
    ]

[tool.ruff.lint.isort]
    known-first-party = ["api_app", "common", "worker_app"]

[tool.ruff.format]
    docstring-code-format = true


# ---------------------------------------------------------------------------
# Pyright. This is the same engine as Pylance, and Pylance reads this section,
# so VSCode shows exactly what `uv run pyright` (pre-commit/CI) enforces.
# `extraPaths` lets imports of workspace packages resolve to their sources.
# ---------------------------------------------------------------------------
[tool.pyright]
    pythonVersion = "3.14"
    typeCheckingMode = "strict"
    venvPath = "."
    venv = ".venv"
    include = [
        "apps",
        "packages",
        "scripts",
    ]
    exclude = [
        "**/.python_packages",
        "**/__pycache__",
        "**/.venv",
        "build",
        "dist",
    ]
    extraPaths = [
        "apps/api-app/src",
        "apps/worker-app/src",
        "packages/common/src",
    ]
    reportMissingModuleSource = "warning"
    reportUnnecessaryTypeIgnoreComment = "warning"


# ---------------------------------------------------------------------------
# pytest. One run (CLI, CI or the VSCode Test Explorer) collects the tests of
# every app and package. `importlib` mode allows identically named test files
# in different apps.
# ---------------------------------------------------------------------------
[tool.pytest]
    minversion = "9.0"
    addopts = [
        "--import-mode=importlib",
        "--strict-markers",
        "--strict-config",
    ]
    markers = [
        "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    ]
    testpaths = [
        "apps",
        "packages",
    ]

[tool.coverage.run]
    branch = true
    source = [
        "apps",
        "packages",
    ]
    omit = [
        "**/tests/**",
    ]

[tool.coverage.report]
    show_missing = true
    skip_covered = true
